// Default: 1.20.1 with Java 17
// For 1.19.2: ./gradlew build -PMC_VERSION=1.19.2 -PMAPPING_VERSION=1.19.2 -PFORGE_VERSION=1.19.2-43.3.13
def mc_version = project.findProperty('MC_VERSION') ?: System.getProperty('MC_VERSION') ?: '1.20.1'
def compileModsDirBase = mc_version.startsWith('1.19') ? 'compile-mods-1.19.2' : 'compile-mods-1.20.1'

println("mcreator.gradle: Using compile-mods for version ${mc_version}")

def compileModsDir = compileModsDirBase
	task addnewfoldersmods(type: DefaultTask){
		ant.mkdir(dir: "${compileModsDir}/");
    }
    repositories {
    	flatDir {
    	name "compile-mods" 
    	dir file(compileModsDir)
    	}
    }
          
    dependencies {
    	for (compileModJar in fileTree(dir: compileModsDir, include: '*.jar')) {
    	def basename = compileModJar.name.substring(0, compileModJar.name.length() - ".jar".length()) 
    	def versionSep = basename.lastIndexOf('-') 
    	assert versionSep != -1 
    	def artifactId = basename.substring(0, versionSep) 
    	def version = basename.substring(versionSep + 1)
    	implementation fg.deobf("compile-mods:$artifactId:$version")}
    }

repositories {
maven {
	url = "https://maven.theillusivec4.top/"
	}
}

dependencies {
	if (mc_version.startsWith('1.19')) {
		runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:1.19.2-5.1.1.0")
		compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:1.19.2-5.1.1.0:api")
	} else if (mc_version.startsWith('1.20')) {
		runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.10.0+1.20.1")
		compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.10.0+1.20.1:api")
	}
}

repositories {
  maven {
      url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
  }
}

dependencies {
