# Minecraft and Forge Version Configuration (Java 17)
# Default: 1.20.1
# 1.19.2 build: ./gradlew build -PMC_VERSION=1.19.2 -PMAPPING_VERSION=1.19.2 -PFORGE_VERSION=1.19.2-43.3.13

MC_VERSION=1.20.1
MAPPING_VERSION=1.20.1
FORGE_VERSION=1.20.1-47.1.0

# =====================================================================
# mod_version — jar 名 と mods.toml の version に反映される。
# 解決順:
#   1. -Pmod_version_override=X.Y.Z で明示指定 (CI / non-interactive)
#   2. ./gradlew build 実行時の対話プロンプト入力 (空 Enter でこの値)
#   3. ここの mod_version (default / fallback)
# release type (alpha/beta/release/test) は対話で別途選択する。
# =====================================================================
mod_version=3

# Build Configuration
#   ForgeGradle 5.1 は systemProp.* よりも org.gradle.jvmargs 経由の -D の方を
#   確実に拾うので、証明書チェック無効化は jvmargs 側に直接書いておく。
#   (maven.minecraftforge.net の証明書チェーンが古い環境で検証失敗するため無効化)
org.gradle.jvmargs=-Xmx4G -Dnet.minecraftforge.gradle.check.certs=false

# 念のため systemProp 側にも残しておく (新しめのプラグインはこちらを拾う)
systemProp.net.minecraftforge.gradle.check.certs=false
