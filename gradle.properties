# Minecraft and Forge Version Configuration (Java 17)
# Default: 1.20.1
# 1.19.2 build: ./gradlew build -PMC_VERSION=1.19.2 -PMAPPING_VERSION=1.19.2 -PFORGE_VERSION=1.19.2-43.3.13

MC_VERSION=1.20.1
MAPPING_VERSION=1.20.1
FORGE_VERSION=1.20.1-47.4.0

# Security overrides for dependencies pulled transitively by Forge/Minecraft.
# Keep the whole Netty family aligned to avoid mixing binary-incompatible patch levels.
NETTY_VERSION=4.1.136.Final
LOG4J_VERSION=2.25.5

# =====================================================================
# mod_version — jar 名 と mods.toml の version に反映される。
# 解決順:
#   1. -Pmod_version_override=X.Y.Z で明示指定 (CI / non-interactive)
#   2. build時にバージョンを入力。空Enterなら build/libs の直前JARを +1
#   3. ここの mod_version (成果物がまだない場合の初期値)
# release type (alpha/beta/release/test) は対話で別途選択する。
# =====================================================================
mod_version=5

# Build Configuration
#   - 証明書チェック無効化 ( maven.minecraftforge.net の証明書チェーンが古い環境向け )
#   - メモリ 4G
#
# 注意: TLS 関連の -D フラグはここでは設定しない。
#   旧マンション ISP の Cisco Umbrella 対策が必要なときだけ run_client_mac.sh が
#   JAVA_TOOL_OPTIONS で動的に注入する ( = テザリング/notls 時は素の TLS で出られる )。
org.gradle.jvmargs=-Xmx4G -Dnet.minecraftforge.gradle.check.certs=false

systemProp.net.minecraftforge.gradle.check.certs=false
