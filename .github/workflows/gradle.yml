name: Multi-Build Workflow

on:
  push:
    branches: [ "1.19.2" ]
  pull_request:
    branches: [ "1.19.2" ]
  workflow_dispatch: # 手動トリガー

jobs:
  mod-build:
    name: Build Mod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # ← CodeQL用に必要

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execution Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build Mod with Gradle Wrapper (no tests)
      run: ./gradlew build -x test --daemon --parallel --configure-on-demand --warning-mode all

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
