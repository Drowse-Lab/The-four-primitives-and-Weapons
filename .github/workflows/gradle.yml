name: Multi-Build Workflow

on:
  push:
    branches: [ "1.19.2" ]
  pull_request:
    branches: [ "1.19.2" ]

jobs:
  mod-build:
    name: Build Mod
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Mod with Gradle Wrapper
      run: ./gradlew build -x test --daemon --incremental

  bad-apple-display:
    name: Display Bad Apple
    runs-on: ubuntu-latest
    needs: mod-build # mod-build終了後に実行

    steps:
    - name: Download Bad Apple Animation
      run: curl -O https://raw.githubusercontent.com/skanehira/badapple.vim/master/resources/badapple.txt

    - name: Display Bad Apple Animation
      run: |
        awk '/^\$+$/ { system("sleep 0.05") } { print }' badapple.txt
