name: Multi-Build Workflow

on:
  push:
    branches: [ "1.19.2" ]
  pull_request:
    branches: [ "1.19.2" ]
  workflow_dispatch: # 手動トリガー追加

jobs:
  mod-build:
    name: Build Mod
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

- name: Cache Gradle
  uses: actions/cache@v3
  with:
    path: ~/.gradle/caches
    key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
    restore-keys: |
      gradle-cache-${{ runner.os }}-

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execution Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build Mod with Gradle Wrapper
      run: ./gradlew build -x test --daemon --incremental

  bad-apple-display:
    name: Display Bad Apple
    runs-on: ubuntu-latest
    needs: mod-build # Runs after the mod-build job
    permissions:
      contents: read

    steps:
    - name: Download Bad Apple Animation
      run: curl -O https://raw.githubusercontent.com/Chion82/ASCII_bad_apple/master/play.txt

    - name: Debug Animation Display
      run: |
        head -n 20 play.txt # 最初の20行を確認

    - name: Display Bad Apple Animation
      run: |
        awk '/^\$+$/ { system("sleep 0.05; clear") } { print }' play.txt
        name: Java CI with Gradle

on:
  push:
    branches: [ "1.19.2" ]
  pull_request:
    branches: [ "1.19.2" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    - name: Make Gradle Wrapper executable
      run: chmod +x ./gradlew

    - name: Build with Gradle Wrapper
      run: ./gradlew build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
        
