buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'

// ペイント編集用の32x32（各角16x16）ツールチップPNGを生成する。
tasks.register('generateTooltipCornerPngs') {
    doLast {
        def outputDir = file('run/config/the_four_primitives_and_weapons/tooltip_corners')
        outputDir.mkdirs()
        def patterns = [
                common:    ['010111', '000100', '001100', '001000', '001000', '010000'],
                uncommon:  ['1111111', '1000000', '1111011', '1101100', '1110000', '1101000', '1100000'],
                rare:      ['111111', '100100', '111100', '110000', '110000', '100000'],
                epic:      ['111111', '101000', '111110', '110100', '111000', '110000'],
                legendary: ['11111111', '10000000', '11101101', '11011100', '11000000', '11010000', '10000000', '10000000'],
                forbidden: ['11111111', '11010100', '10111010', '11101000', '11010000', '10100000', '11000000', '10000000']
        ]
        def colors = [
                common: 0xFFCBE8F7, uncommon: 0xFF35FF50, rare: 0xFF419BFF,
                epic: 0xFFC02FFF, legendary: 0xFFFFB000, forbidden: 0xFFFF3B3B
        ]
        patterns.each { name, rows ->
            def image = new java.awt.image.BufferedImage(32, 32, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            rows.eachWithIndex { row, y ->
                row.eachWithIndex { value, x ->
                    if (value == '1') {
                        int color = colors[name] as int
                        image.setRGB(x, y, color)
                        image.setRGB(31 - x, y, color)
                        image.setRGB(x, 31 - y, color)
                        image.setRGB(31 - x, 31 - y, color)
                    }
                }
            }
            javax.imageio.ImageIO.write(image, 'png', new File(outputDir, "${name}.png"))
        }
    }
}

// ペイント編集用の属性紋様16x16 PNGを生成する。
tasks.register('generateTooltipElementPngs') {
    doLast {
        def outputDir = file('run/config/the_four_primitives_and_weapons/tooltip_elements')
        outputDir.mkdirs()
        def colors = [
                ice: 0xFF9DEBFF, electric: 0xFF5FFFF2, corrosion: 0xFF86B82B,
                holy: 0xFFFFF2A8, dark: 0xFF7652B8, fire: 0xFFFF5A24,
                wind: 0xFFB8F2D0, thunder: 0xFFFFE135, water: 0xFF3D9BFF,
                miasma: 0xFF9A50A8, blood: 0xFFD41432, erasure: 0xFFB8A6D9,
                soul: 0xFF63D7FF, soul_fire: 0xFF28AFFF
        ]
        def pixels = [
                ice: [[7,3],[7,4],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[7,6],[7,7],[5,3],[9,3],[5,7],[9,7]],
                electric: [[5,3],[6,4],[7,5],[6,6],[9,3],[8,5],[9,6],[10,7]],
                corrosion: [[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[9,4],[10,4],[11,4],[5,5],[5,6],[8,5],[8,6],[8,7],[10,5]],
                holy: [[4,5],[5,4],[6,4],[7,4],[8,4],[9,4],[10,5],[5,6],[6,6],[7,6],[8,6],[9,6],[7,3],[7,7]],
                dark: [[6,3],[7,3],[8,3],[5,4],[5,5],[6,6],[7,7],[8,7],[9,6]],
                fire: [[5,7],[5,6],[6,5],[6,3],[7,4],[8,2],[8,5],[9,4],[10,6],[9,7],[8,8],[7,8],[6,8]],
                wind: [[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[9,4],[5,6],[6,6],[7,6],[8,6],[9,6],[10,6],[11,6],[9,8],[10,8],[11,8]],
                thunder: [[8,2],[6,6],[8,6],[6,10],[11,5],[9,5],[10,2]],
                water: [[3,6],[4,5],[5,5],[6,6],[7,6],[8,5],[9,5],[10,6],[11,6],[4,8],[5,7],[6,7],[7,8],[8,8],[9,7],[10,7],[11,8]],
                miasma: [[4,4],[7,3],[10,5],[5,7],[8,8],[11,7],[3,9],[6,10],[9,10]],
                blood: [[7,2],[6,3],[8,3],[5,5],[7,5],[9,5],[4,7],[5,8],[7,7],[7,8],[9,7],[10,8]],
                erasure: [[3,5],[4,5],[5,5],[7,7],[9,4],[10,4],[11,4]],
                soul: [[7,2],[6,3],[8,3],[5,5],[6,6],[7,7],[8,6],[9,5],[7,9]],
                soul_fire: [[5,3],[6,5],[6,7],[8,2],[8,4],[9,6],[10,3],[10,7]]
        ]
        colors.each { name, colorValue ->
            def image = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            pixels[name].each { point -> image.setRGB(point[0] as int, point[1] as int, colorValue as int) }
            javax.imageio.ImageIO.write(image, 'png', new File(outputDir, "${name}.png"))
        }
    }
}

// 外部 mod ( libs/local/ 配下の .jar 全部 ) を runClient/runServer に同梱するためのトグル。
//
// 使い方:
//   1. libs/local/ に追加したい外部 mod jar を 「mod 名関係なく」 投げ込む
//      ( フラットでも libs/local/<modid>/<version>/*.jar の階層でも OK、 再帰で全部拾う )
//   2. CLI で有効化: ./gradlew runClient -PwithExternalMods=true
//      または gradle.properties に withExternalMods=true
//   3. off にするだけで 1 行も触らずに 外部 mod を全部 切れる
def boolProp = { String name, boolean defaultValue ->
    def v = project.findProperty(name)
    if (v == null) return defaultValue
    return v.toString().equalsIgnoreCase('true')
}
def withExternalMods = boolProp('withExternalMods', false)
// 後方互換: withSpellbooks=true でも有効化できる ( 既存スクリプト用 )
if (!withExternalMods) withExternalMods = boolProp('withSpellbooks', false)

// =====================================================================
// version 解決順:
//   1. -Pmod_version_override=X.Y.Z (CI / 非対話の上書き)
//   2. build/libs で最後に生成された同 MOD の JAR のバージョン + 1
//   3. gradle.properties の mod_version (JAR がまだない場合の初期値)
//   4. ハードコード fallback '3'
// =====================================================================
def baseResolvedVersion = (project.findProperty('mod_version_override')
        ?: project.findProperty('mod_version')
        ?: '3')

// release type サフィックス:
//   alpha  → "-alpha"
//   beta   → "-beta"   (default)
//   rc     → "-rc"
//   release → ""        (suffix 無し)
//   test   → "-test"   (ローカル動作確認用)
ext.stripReleaseSuffix = { String v -> v?.replaceFirst(/-(alpha|beta|rc|test)(\.\d+)?$/, '') }
ext.incrementLastVersionNumber = { String v ->
    def base = stripReleaseSuffix(v ?: '')
    def matcher = (base =~ /^(.*?)(\d+)$/)
    if (!matcher.matches()) return base
    return matcher.group(1) + (matcher.group(2).toInteger() + 1)
}
ext.suffixForReleaseType = { String type ->
    if (!type) return '-beta'
    def t = type.toLowerCase().trim()
    if (t.startsWith('r') && !t.startsWith('rc')) return ''
    if (t.startsWith('rc')) return '-rc'
    if (t.startsWith('a')) return '-alpha'
    if (t.startsWith('t')) return '-test'
    return '-beta'
}

// stdin を 1 行読む。System.console() を優先、 null なら System.in 直読みに fallback。
// (VSCode / IntelliJ の terminal でも動く。同一 BufferedReader を使い回して
//  piped stdin の 2 行目以降が空文字で消費されるのを防ぐ。)
ext.cachedStdinReader = null
ext.readLineFlexible = { ->
    def console = System.console()
    if (console != null) {
        try { return console.readLine() } catch (Throwable ignored) {}
    }
    if (project.ext.cachedStdinReader == null) {
        try {
            project.ext.cachedStdinReader = new BufferedReader(new InputStreamReader(System.in))
        } catch (Throwable ignored) {
            return null
        }
    }
    try {
        return project.ext.cachedStdinReader.readLine()
    } catch (Throwable ignored) {
        return null
    }
}

def overrideReleaseType = project.findProperty('release_type')
def overrideModVersion  = project.findProperty('mod_version_override')
def isCi = System.getenv('CI') == 'true' || System.getenv('GITHUB_ACTIONS') == 'true'
def isJarBuild = gradle.startParameter.taskNames.any {
    def task = it.tokenize(':').last()
    task in ['build', 'assemble', 'jar', 'reobfJar']
}

// 明示指定がない JAR ビルドでは、更新日時が最も新しい成果物を「前回」とする。
// clean build でも設定フェーズは clean より先なので、削除前の JAR を参照できる。
def autoIncrementedBase = null
if (!overrideModVersion && isJarBuild) {
    def libsDir = file('build/libs')
    def prefix = 'The four primitives and Weapons-1.20.1-'
    def previousJars = libsDir.exists()
            ? libsDir.listFiles().findAll { it.isFile() && it.name.startsWith(prefix) && it.name.endsWith('.jar') }
            : []
    def previousJar = previousJars ? previousJars.max { it.lastModified() } : null
    if (previousJar != null) {
        def previousVersion = previousJar.name.substring(prefix.length(), previousJar.name.length() - '.jar'.length())
        autoIncrementedBase = incrementLastVersionNumber(previousVersion)
        logger.lifecycle("[the_four_primitives_and_weapons] previous JAR: ${previousJar.name} -> next version: ${autoIncrementedBase}")
    }
}
if (autoIncrementedBase != null) {
    baseResolvedVersion = autoIncrementedBase
}
def shouldPrompt = !overrideReleaseType &&
        !overrideModVersion &&
        !isCi &&
        gradle.startParameter.taskNames.any { it == 'build' || it.endsWith(':build') }

// バージョン入力。空 Enter の場合だけ直前 JAR + 1 の自動採番を使う。
def chosenBaseVersion = null
if (shouldPrompt) {
    def fallbackBase = stripReleaseSuffix(baseResolvedVersion)
    print "\n[the_four_primitives_and_weapons] Enter mod version (press Enter for auto ${fallbackBase}):\n  > "
    System.out.flush()
    def input = readLineFlexible()?.trim()
    if (input) {
        chosenBaseVersion = stripReleaseSuffix(input)
        logger.lifecycle("[the_four_primitives_and_weapons] version entered: ${chosenBaseVersion}")
    } else {
        chosenBaseVersion = fallbackBase
        logger.lifecycle("[the_four_primitives_and_weapons] auto version: ${chosenBaseVersion}")
    }
}

// 2) release type 選択
def chosenReleaseType = null
if (overrideReleaseType) {
    chosenReleaseType = overrideReleaseType
} else if (shouldPrompt) {
    def base = chosenBaseVersion ?: stripReleaseSuffix(baseResolvedVersion)
    print "\n[the_four_primitives_and_weapons] Select release type for version ${base}:\n" +
          "  [b]eta     (default)\n" +
          "  [a]lpha\n" +
          "  [r]elease  (suffix 無し)\n" +
          "  [rc]       (release candidate)\n" +
          "  [t]est     (ローカル動作確認用)\n" +
          "  > "
    System.out.flush()
    def input = readLineFlexible()
    chosenReleaseType = input?.trim() ? input.trim() : 'beta'
    logger.lifecycle("[the_four_primitives_and_weapons] release_type=${chosenReleaseType} → version=${base}${suffixForReleaseType(chosenReleaseType)}")
}

// 3) 最終 version を組み立て
def effectiveBase = chosenBaseVersion ?: stripReleaseSuffix(baseResolvedVersion)
def mod_version
if (chosenReleaseType) {
    mod_version = effectiveBase + suffixForReleaseType(chosenReleaseType)
} else if (chosenBaseVersion) {
    mod_version = chosenBaseVersion
} else {
    mod_version = baseResolvedVersion
}
version = mod_version
group = 'com.hrmcngs.the_four_primitives_and_weapons'
archivesBaseName = 'The four primitives and Weapons-forge-1.20.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Default: 1.20.1 with Java 17
// For 1.19.2: ./gradlew build -PMC_VERSION=1.19.2 -PMAPPING_VERSION=1.19.2 -PFORGE_VERSION=1.19.2-43.3.13
def mc_version = project.findProperty('MC_VERSION') ?: '1.20.1'
def mapping_version = project.findProperty('MAPPING_VERSION') ?: '1.20.1'
def forge_version = project.findProperty('FORGE_VERSION') ?: '1.20.1-47.4.0'

println("Building for Minecraft ${mc_version} with Forge ${forge_version}")

minecraft {
    mappings channel: 'official', version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                the_four_primitives_and_weapons {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                the_four_primitives_and_weapons {
                    source sourceSets.main
                }
            }
        }
    }
}

// Generate the SRG refmap required by Mixins in a normal (obfuscated) Minecraft
// installation. Development runs use Mojang method names and can otherwise hide
// a missing refmap until the distributed JAR is launched.
mixin {
    add sourceSets.main, 'the_four_primitives_and_weapons.refmap.json'
    config 'the_four_primitives_and_weapons.melon.mixins.json'
    config 'mixins.the_four_primitives_and_weapons.json'
}

repositories {
    // libs/ をローカル Maven リポジトリとして登録 ( Backpack-Arsenal と同じ方式 )
    //   libs/local/<artifact>/<version>/<artifact>-<version>.jar が
    //   "local:<artifact>:<version>" として解決される。
    //   これで fg.deobf("local:...") が SRG → official のリマップを掛けてくれるので
    //   dev userdev 環境でもクラッシュせず動く。
    maven {
        url = file('libs').toURI()
        metadataSources { artifact() }
    }
    // CurseForge Maven (Iron's Spellbooks など、CurseForge 公開 MOD の取得用)
    maven {
        url 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Iron's Spellbooks 依存: Playeranimator / Geckolib など
    maven { url 'https://thedarkcolour.github.io/KotlinForForge/' } // kotlin for forge (transitive)
    maven { url 'https://maven.blamejared.com' }                    // Playeranimator
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } // GeckoLib
}

// Forge/Minecraft pins older transitive versions of these libraries. Override every
// configuration so development runs, tests, and packaged runtime resolution all use
// versions containing the current security fixes.
def netty_version = project.findProperty('NETTY_VERSION') ?: '4.1.136.Final'
def log4j_version = project.findProperty('LOG4J_VERSION') ?: '2.25.5'
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.netty') {
            details.useVersion netty_version
            details.because 'Netty security fixes through CVE-2026-59901'
        } else if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion log4j_version
            details.because 'Log4j security fix for CVE-2026-49844'
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    minecraft "net.minecraftforge:forge:${forge_version}"

    // ─── 外部 mod 同梱 ( libs/local/ 配下の .jar を Maven 風配置に変換して取り込み ) ──
    //   - mod 名 / version は記載不要。 jar のファイル名から自動推定する。
    //   - フラット配置 ( libs/local/foo-1.2.3.jar ) を Maven 階層
    //     ( libs/local/foo/1.2.3/foo-1.2.3.jar ) に自動配置 → fg.deobf("local:foo:1.2.3")
    //   - これで ForgeGradle が SRG → official deobf を掛けるので dev でも動作する。
    if (withExternalMods) {
        def localDir = file('libs/local')
        if (!localDir.exists()) {
            println "[Build] [external] libs/local/ が無いので作成してください ( jar を入れると自動ロード )"
        } else {
            // ファイル名から artifact + version を推定 ( 最初に数字で始まる token から先を version )
            def parseJar = { String baseName ->
                def tokens = baseName.split('-')
                def i = tokens.findIndexOf { it ==~ /^\d.*/ }
                if (i <= 0) return null
                return [
                    artifact: tokens[0..<i].join('-'),
                    version : tokens[i..-1].join('-')
                ]
            }
            int count = 0
            // フラット配置の jar を Maven 階層に転送
            localDir.listFiles()?.findAll { it.isFile() && it.name.endsWith('.jar') }?.each { f ->
                def base = f.name.replaceFirst(/\.jar$/, '')
                def info = parseJar(base)
                if (info == null) {
                    println "[Build] [external] ${f.name} のファイル名から artifact/version を解析できません ( skip )"
                    return
                }
                def mvnDir = new File(localDir, "${info.artifact}/${info.version}")
                def mvnJar = new File(mvnDir, "${info.artifact}-${info.version}.jar")
                if (!mvnJar.exists()) {
                    mvnDir.mkdirs()
                    java.nio.file.Files.copy(f.toPath(), mvnJar.toPath())
                }
                println "[Build] [external] local:${info.artifact}:${info.version} を fg.deobf で取り込み"
                runtimeOnly fg.deobf("local:${info.artifact}:${info.version}")
                count++
            }
            // 既に Maven 階層に置かれてる jar も拾う
            (localDir.listFiles()?.findAll { it.isDirectory() } ?: []).each { artifactDir ->
                artifactDir.listFiles()?.findAll { it.isDirectory() }?.each { verDir ->
                    def expected = new File(verDir, "${artifactDir.name}-${verDir.name}.jar")
                    if (expected.exists()) {
                        // 上のループで既に処理済みかも — 重複追加しない
                        def alreadyHave = (count > 0)  // 簡易判定 ( フラット派生は count > 0 になっている )
                        if (!alreadyHave) {
                            println "[Build] [external] local:${artifactDir.name}:${verDir.name} を fg.deobf で取り込み"
                            runtimeOnly fg.deobf("local:${artifactDir.name}:${verDir.name}")
                            count++
                        }
                    }
                }
            }
            if (count == 0) {
                println "[Build] [external] libs/local/ に .jar が見つかりません"
            } else {
                println "[Build] [external] 合計 ${count} 個の外部 mod jar をロード"
            }
        }
    }
}

// 生成 jar 名: archivesBaseName-version.jar の形を mod_version で動的に組み立てる。
// (Backpack-Arsenal addon が期待する命名規則: <name>-<mc>-<version>.jar)
jar {
    archiveFileName = "The four primitives and Weapons-1.20.1-${mod_version}.jar"
    // Mixin 設定を JAR マニフェストに宣言 ( Forge はこれで mixin config を登録する )。
    //   dev では src/main/resources/META-INF/MANIFEST.MF が展開モッドのマニフェストとして読まれる。
    manifest {
        attributes(["MixinConfigs": "the_four_primitives_and_weapons.melon.mixins.json,mixins.the_four_primitives_and_weapons.json"])
    }
    // リソース側 MANIFEST.MF ( dev 用 ) は jar では manifest{} と二重になるため除外。
    exclude 'META-INF/MANIFEST.MF'
}

processResources {
    inputs.property 'mc_version', mc_version
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'mc_version': mc_version, 'version': mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

apply from: 'mcreator.gradle'
apply from: 'lock_all_codes.gradle'
