buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

// Iron's Spells 'n Spellbooks をテスト用に同梱する。
// 有効化: ./gradlew runClient -PwithSpellbooks=true
//         または gradle.properties に withSpellbooks=true
def withSpellbooks = project.findProperty('withSpellbooks') == 'true'

version = '1.0'
group = 'com.hrmcngs.the_four_primitives_and_weapons'
archivesBaseName = 'The four primitives and Weapons-forge-1.20.1-'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Default: 1.20.1 with Java 17
// For 1.19.2: ./gradlew build -PMC_VERSION=1.19.2 -PMAPPING_VERSION=1.19.2 -PFORGE_VERSION=1.19.2-43.3.13
def mc_version = project.findProperty('MC_VERSION') ?: '1.20.1'
def mapping_version = project.findProperty('MAPPING_VERSION') ?: '1.20.1'
def forge_version = project.findProperty('FORGE_VERSION') ?: '1.20.1-47.1.0'

println("Building for Minecraft ${mc_version} with Forge ${forge_version}")

minecraft {
    mappings channel: 'official', version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                the_four_primitives_and_weapons {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                the_four_primitives_and_weapons {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // CurseForge Maven (Iron's Spellbooks など、CurseForge 公開 MOD の取得用)
    maven {
        url 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Iron's Spellbooks 依存: Playeranimator / Geckolib など
    maven { url 'https://thedarkcolour.github.io/KotlinForForge/' } // kotlin for forge (transitive)
    maven { url 'https://maven.blamejared.com' }                    // Playeranimator
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } // GeckoLib
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    if (withSpellbooks) {
        // CurseForge project IDs for Iron's Spells 'n Spellbooks (1.20.1 Forge):
        //   projectId:    855414     (irons-spells-n-spellbooks)
        //   fileId:       YYYYYYY    ← 最新版の fileId に置き換える
        // 手動指定例 (fileId は https://www.curseforge.com/minecraft/mc-mods/irons-spells-n-spellbooks/files から取得):
        // runtimeOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:5500000")
        //
        // より確実な方法: ローカルに JAR をドロップ。次の行を有効化する:
        // runtimeOnly fg.deobf(files('libs/ironsspellbooks-1.20.1.jar'))
        println "[Build] withSpellbooks=true: Iron's Spellbooks を実行時に読み込みます (libs/ に JAR を置いてください)"
        if (file('libs/ironsspellbooks-1.20.1.jar').exists()) {
            runtimeOnly fg.deobf(files('libs/ironsspellbooks-1.20.1.jar'))
        } else {
            println "[Build] libs/ironsspellbooks-1.20.1.jar が見つかりません。run/mods/ に直接置いても動作します。"
        }
    }
}

processResources {
    inputs.property 'mc_version', mc_version
    filesMatching('META-INF/mods.toml') {
        expand 'mc_version': mc_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

apply from: 'mcreator.gradle'
apply from: 'lock_all_codes.gradle'

